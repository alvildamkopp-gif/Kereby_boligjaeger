name: Kereby Boligjæger

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pakker
        run: pip install requests

      - name: Kør Kereby-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kereby_bot.py

      - name: Gem ændringer
        run: |
          git config user.name "Kereby Bot"
          git config user.email "kereby-bot@users.noreply.github.com"
          git add seen_boliger.json
          git diff --cached --quiet || git commit -m "Opdater sete boliger"
          git push
